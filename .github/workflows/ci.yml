name: ci

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact development dependencies
        run: npm ci --ignore-scripts
      - name: Execute the complete test universe
        run: npm test
      - name: Execute the living-graph smoke scenario
        run: npm run demo:living
      - name: Audit production dependency surface
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify the publishable package
        run: npm pack --dry-run

  runtime-active-lts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact development dependencies
        run: npm ci --ignore-scripts
      - name: Verify the complete runtime on Active LTS
        run: npm test
      - name: Execute the living-graph smoke scenario
        run: npm run demo:living

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate the fail-closed Compose model
        run: docker compose --env-file .env.example -f compose.lab.yml config --quiet
      - name: Build the production Observer image
        run: docker build --file Dockerfile.lab --tag anu-lab:ci .
