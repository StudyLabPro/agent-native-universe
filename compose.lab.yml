name: anu-lab

x-lab-runtime: &lab-runtime
  build:
    context: .
    dockerfile: Dockerfile.lab
  image: ${ANU_LAB_IMAGE:-agent-native-universe-lab:local}
  init: true
  user: "1000:1000"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  pids_limit: 256
  cpus: ${ANU_LAB_CPUS:-2.0}
  mem_limit: ${ANU_LAB_MEMORY_LIMIT:-2g}
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  lab-observer:
    <<: *lab-runtime
    restart: unless-stopped
    command:
      - node
      - dist/lab/runner.js
      - serve
      - --data-dir
      - /data
      - --port
      - "3000"
    volumes:
      - lab-evidence:/data:ro
    expose:
      - "3000"
    networks:
      - control
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      traefik.enable: "false"

  # Public routing is deliberately opt-in. It requires both a file-mounted
  # application Bearer token and a rotated Traefik authentication middleware.
  lab-observer-edge:
    <<: *lab-runtime
    profiles:
      - edge
    restart: unless-stopped
    command:
      - node
      - dist/lab/runner.js
      - serve
      - --data-dir
      - /data
      - --port
      - "3000"
      - --auth-token-file
      - /run/secrets/anu_lab_observer_token
    secrets:
      - source: anu_lab_observer_token
        target: anu_lab_observer_token
    volumes:
      - lab-evidence:/data:ro
    expose:
      - "3000"
    networks:
      - edge
      - control
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: "dev-studyninja-network"
      traefik.http.routers.anu-lab-observer.rule: "Host(`${ANU_LAB_HOST:-lab.anu.xteam.pro}`)"
      traefik.http.routers.anu-lab-observer.entrypoints: "websecure"
      traefik.http.routers.anu-lab-observer.tls: "true"
      traefik.http.routers.anu-lab-observer.tls.certresolver: "letsencrypt"
      traefik.http.routers.anu-lab-observer.middlewares: "${ANU_LAB_AUTH_MIDDLEWARE:-anu-lab-auth-required@docker},anu-lab-security@docker,anu-lab-rate-limit@docker,anu-lab-inflight@docker"
      traefik.http.routers.anu-lab-observer.service: "anu-lab-observer"
      traefik.http.services.anu-lab-observer.loadbalancer.server.port: "3000"
      traefik.http.services.anu-lab-observer.loadbalancer.healthcheck.path: "/readyz"
      traefik.http.services.anu-lab-observer.loadbalancer.healthcheck.interval: "15s"
      traefik.http.services.anu-lab-observer.loadbalancer.healthcheck.timeout: "5s"
      traefik.http.middlewares.anu-lab-security.headers.contenttypenosniff: "true"
      traefik.http.middlewares.anu-lab-security.headers.framedeny: "true"
      traefik.http.middlewares.anu-lab-security.headers.referrerpolicy: "no-referrer"
      traefik.http.middlewares.anu-lab-security.headers.forcestsheader: "true"
      traefik.http.middlewares.anu-lab-security.headers.stsseconds: "31536000"
      traefik.http.middlewares.anu-lab-rate-limit.ratelimit.average: "20"
      traefik.http.middlewares.anu-lab-rate-limit.ratelimit.period: "1s"
      traefik.http.middlewares.anu-lab-rate-limit.ratelimit.burst: "40"
      traefik.http.middlewares.anu-lab-inflight.inflightreq.amount: "32"

  lab-runner:
    <<: *lab-runtime
    profiles:
      - runner
    restart: "no"
    command:
      - node
      - dist/lab/runner.js
      - run
      - --data-dir
      - /data
      - --universes
      - ${ANU_LAB_UNIVERSES:-1}
      - --agents
      - ${ANU_LAB_AGENTS:-16}
      - --ticks
      - ${ANU_LAB_TICKS:-500}
    volumes:
      - lab-evidence:/data
    networks:
      - control
    healthcheck:
      disable: true

  # The only service in the cognitive profile with an egress route and the
  # provider credential. It is not published to the host or the edge network.
  lab-llm-gateway:
    <<: *lab-runtime
    profiles:
      - cognitive
    # Counters and stop thresholds are process-local. Automatic restart would
    # silently create a new treatment budget inside the same Compose run.
    restart: "no"
    cpus: ${ANU_LLM_GATEWAY_CPUS:-1.0}
    mem_limit: ${ANU_LLM_GATEWAY_MEMORY_LIMIT:-512m}
    command:
      - node
      - dist/lab/runner.js
      - gateway
      - --upstream
      - ${ANU_LLM_UPSTREAM:-https://disabled.invalid/v1}
      - --api-key-file
      - /run/secrets/anu_llm_provider_key
      - --auth-token-file
      - /run/secrets/anu_llm_gateway_token
      - --models
      - ${ANU_LLM_MODEL:-disabled-model}
      - --max-requests
      - ${ANU_LLM_GATEWAY_MAX_REQUESTS:-250}
      - --max-total-tokens
      - ${ANU_LLM_GATEWAY_TOKEN_STOP_THRESHOLD:-1000000}
      - --rate-per-minute
      - ${ANU_LLM_GATEWAY_RATE_PER_MINUTE:-30}
      - --max-in-flight
      - ${ANU_LLM_GATEWAY_MAX_IN_FLIGHT:-4}
      - --max-response-bytes
      - ${ANU_LLM_GATEWAY_MAX_RESPONSE_BYTES:-8388608}
      - --audit
      - /audit/gateway.jsonl
      - --max-audit-bytes
      - ${ANU_LLM_GATEWAY_MAX_AUDIT_BYTES:-67108864}
      - --timeout-ms
      - ${ANU_LLM_GATEWAY_TIMEOUT_MS:-180000}
      - --host
      - 0.0.0.0
      - --port
      - "8790"
    secrets:
      - source: anu_llm_provider_key
        target: anu_llm_provider_key
      - source: anu_llm_gateway_token
        target: anu_llm_gateway_token
    volumes:
      - lab-llm-audit:/audit
    expose:
      - "8790"
    networks:
      - llm-control
      - llm-egress
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/readyz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      traefik.enable: "false"

  # Cognitive workers can reach the gateway and the evidence volume only.
  # They have no route to the provider or the public Internet.
  lab-runner-cognitive:
    <<: *lab-runtime
    profiles:
      - cognitive
    restart: "no"
    depends_on:
      lab-llm-gateway:
        condition: service_healthy
    command:
      - node
      - dist/lab/runner.js
      - genesis-1
      - --cohort
      - ${ANU_LLM_COHORT:-B}
      - --data-dir
      - /data
      - --universe-id
      - ${ANU_LLM_UNIVERSE_ID:-U0001}
      - --agents
      - ${ANU_LAB_AGENTS:-16}
      - --ticks
      - ${ANU_LLM_TICKS:-50}
    environment:
      ANU_LLM_API_KEY_FILE: /run/secrets/anu_llm_gateway_token
      ANU_LLM_BASE_URL: http://lab-llm-gateway:8790/v1
      ANU_LLM_IDENTITY_URL: http://lab-llm-gateway:8790/identity
      ANU_LLM_MODEL: ${ANU_LLM_MODEL:-disabled-model}
      ANU_LLM_AGENTS_PER_TICK: ${ANU_LLM_AGENTS_PER_TICK:-4}
      ANU_LLM_CONCURRENCY: ${ANU_LLM_CONCURRENCY:-4}
      ANU_LLM_MAX_TOKENS: ${ANU_LLM_MAX_TOKENS:-2048}
    secrets:
      - source: anu_llm_gateway_token
        target: anu_llm_gateway_token
    volumes:
      - lab-evidence:/data
    networks:
      - llm-control
    healthcheck:
      disable: true

networks:
  edge:
    external: true
    name: dev-studyninja-network
  control:
    driver: bridge
    internal: true
  llm-control:
    driver: bridge
    internal: true
  # Only the gateway joins this non-internal network.
  llm-egress:
    driver: bridge

volumes:
  lab-evidence:
    driver: local
  lab-llm-audit:
    driver: local

secrets:
  anu_lab_observer_token:
    # Keep the real file outside the repository. /dev/null makes edge startup
    # fail closed while allowing the default Compose model to be validated.
    file: ${ANU_LAB_OBSERVER_TOKEN_FILE:-/dev/null}
  anu_llm_provider_key:
    # A provider-scoped key with an independent provider-side hard spend cap.
    file: ${ANU_LLM_PROVIDER_KEY_FILE:-/dev/null}
  anu_llm_gateway_token:
    # Shared only by the cognitive worker and gateway. Minimum 32 token68 bytes.
    file: ${ANU_LLM_GATEWAY_TOKEN_FILE:-/dev/null}
