# Drop-in к anu-secrets.service: окружение, без которого CLI `mws` не
# запускается из СИСТЕМНОГО юнита.
#
# ИЗМЕРЕНО на Lab (2026-09-08):
#   systemd-run --wait --pipe /bin/sh -c 'echo HOME=${HOME:-UNSET}; echo PATH=$PATH'
#   -> HOME=UNSET
#   -> PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/snap/bin
# Штатное место CLI — /root/.local/bin/mws, в этот PATH оно не входит, а
# без HOME клиент не найдёт свой профиль. Без этого drop-in Ш5 падает с
# «команда mws не найдена», и отказ выглядит как проблема с секретами.
#
# ProtectSystem=strict в самом юните делает всё, кроме ReadWritePaths,
# только читаемым. Профиль mws читается, но клиент может захотеть писать
# кэш обменянного токена — поэтому его каталог открыт на запись ТОЧЕЧНО,
# а не весь $HOME.
[Service]
Environment=HOME=/root
Environment=PATH=/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
# Имя облачного проекта (внешний контекст) — из локального файла на VM,
# который кладёт оператор из deploy/mws/target.env.example.
EnvironmentFile=/etc/anu-live/target.env
# Оба пути с префиксом «-»: отсутствующий ReadWritePaths роняет юнит на
# настройке mount namespace, и отказ выглядит как что угодно, только не
# как «профиль mws не установлен». Пусть падает сам вызов CLI — у него
# сообщение по делу.
ReadWritePaths=-/root/.config/mws
ReadWritePaths=-/root/.cache/mws
