# Drop-in к anu-secrets.service (сам юнит не правится — он принят в L5a).
#
# Зачем. Контейнеры стека объявлены с restart: unless-stopped, поэтому
# после перезагрузки их поднимает САМ dockerd, не дожидаясь ни
# anu-live.service, ни anu-secrets.service. А /run — tmpfs: после
# перезагрузки секретов там нет. Контейнер, поднятый раньше секретов,
# получил бы отсутствующий bind-источник.
#
# Поэтому секреты читаются ДО запуска dockerd. Цикла не возникает:
# anu-secrets.service зависит только от network-online.target, а не от
# docker.service.
[Unit]
Before=docker.service
